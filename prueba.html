<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UBV | Navegación</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">UBV Navegación</div>
        <div class="user-controls">
            <span id="user-display">Invitado</span>
            <button onclick="abrirPanelAdmin()" id="btn-perfil" style="display:none;">Perfil Admin</button>
            <button onclick="logout()" id="btn-logout" style="display:none;" class="btn-logout">Cerrar Sesión</button>
            <button onclick="accesoAdmin()" id="btn-admin">Admin</button>
        </div>
    </header>

    <main>
        <div class="selector-panel">
            <div class="control-group">
                <label>Piso</label>
                <select id="sel-piso" onchange="actualizarPiso()"></select>
            </div>
            <div class="control-group">
                <label>Origen</label>
                <select id="sel-origen"></select>
            </div>
            <div class="control-group">
                <label>Destino</label>
                <select id="sel-destino"></select>
            </div>
            <button onclick="prepararRuta()" class="btn-primary">Trazar Ruta</button>
        </div>

        <div id="status-bar">Cargando...</div>

        <div id="mapa-viewport">
            <img id="img-mapa" src="" alt="Mapa" onclick="gestionarClicMapa(event)">
            <canvas id="canvas-ruta"></canvas>
        </div>
    </main>

    <div id="panel-admin" class="selector-panel" style="display:none; position:fixed; right:20px; top:80px; max-width:450px; z-index:1000; max-height:90vh; overflow-y:auto;">
        <h2>Panel de Control</h2>
        <p>Estás logueado como: <b>Administrador</b></p>
        <hr>
        
        <h3>Configuración GitHub (primera vez)</h3>
        <label>Usuario/Organización:</label>
        <input type="text" id="github-user" placeholder="tu-usuario" style="width:100%; margin-bottom:5px;">
        <label>Repositorio:</label>
        <input type="text" id="github-repo" placeholder="nombre-repo" style="width:100%; margin-bottom:5px;">
        <label>Token GitHub:</label>
        <input type="password" id="github-token" placeholder="ghp_xxxxxxxxxxxx" style="width:100%; margin-bottom:5px;">
        <button onclick="guardarConfigGitHub()" style="background:#1976d2; color:white; margin-bottom:10px;">Guardar Config</button>
        <hr>
        
        <h3>JSON generado</h3>
        <textarea id="json-output-admin" style="width:100%; height:200px; font-family:monospace;" readonly></textarea>
        <button onclick="copiarJSONAdmin()" style="background:#444; color:white; margin-top:5px;">Copiar JSON</button>
        <button onclick="descargarJSONAdmin()" style="background:#2e7d32; color:white; margin-top:5px;">Descargar JSON</button>
        <button onclick="guardarEnGitHub()" style="background:#d32f2f; color:white; margin-top:5px;">💾 Guardar en GitHub</button>
        <div id="github-status" style="margin-top:5px; font-size:12px;"></div>
        <br><br>
        <button onclick="resetearMemoria()" style="background:orange;">Resetear Cambios Locales</button>
        <br><br>
        <button onclick="cerrarPanelAdmin()" class="btn-logout">Cerrar Panel</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
